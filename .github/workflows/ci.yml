name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # The production build instantiates ConvexReactClient at module scope
      # during static prerendering, which throws if this is unset. No
      # network call happens at build time, so a well-formed placeholder is
      # enough for CI; the real deployment needs its own value configured
      # wherever it's hosted.
      NEXT_PUBLIC_CONVEX_URL: https://ci-placeholder.convex.cloud

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm run lint

      - run: npm run test

      - run: npm run build
